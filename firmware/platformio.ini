; T-Watch S3 badge firmware — single-app build.
;
; platform: pioarduino fork, because mainline PlatformIO espressif32 tops out at
;           IDF <=5.2 and LilyGoLib needs the IDF 5.3+ RGB panel API.
; board:    LilyGo's own definition (16MB flash, 8MB OPI PSRAM, USB CDC on boot).
; radio:    SX1262, matching this unit.
; libs:     LilyGoLib pinned to the local 0.3.0 clone so the API we build against
;           is the one we read; bump deliberately.

[platformio]
default_envs = badge

[env:badge]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = lilygo-t-watch-s3
upload_speed = 921600
monitor_speed = 115200
board_build.filesystem = fatfs
board_build.partitions = partitions.csv

build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_T_WATCH_S3
    -D ARDUINO_LILYGO_LORA_SX1262
    -I variants/lilygo_twatch_s3
    ; The core's USB library (pulled in by LilyGoLib's usb/USB_MSC.cpp) includes
    ; FS.h from the framework's own FS library, which PlatformIO's dependency
    ; finder does not put on the include path. Point at it explicitly.
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/FS/src
    -Wnarrowing
    ; trim RadioLib to what this unit has, keeps the image smaller
    -D RADIOLIB_EXCLUDE_RF69
    -D RADIOLIB_EXCLUDE_SX1231
    -D RADIOLIB_EXCLUDE_RFM2X
    -D RADIOLIB_EXCLUDE_SX127X
    -D RADIOLIB_EXCLUDE_AFSK
    -D RADIOLIB_EXCLUDE_AX25
    -D RADIOLIB_EXCLUDE_HELLSCHREIBER
    -D RADIOLIB_EXCLUDE_MORSE
    -D RADIOLIB_EXCLUDE_RTTY
    -D RADIOLIB_EXCLUDE_SSTV
    -D RADIOLIB_EXCLUDE_DIRECT_RECEIVE
    -D RADIOLIB_EXCLUDE_APRS
    -D RADIOLIB_EXCLUDE_BELL

monitor_filters =
    default
    esp32_exception_decoder

lib_deps =
    https://github.com/Xinyuan-LilyGO/LilyGoLib.git
    lvgl/lvgl @ ^9.4.0
    jgromes/RadioLib @ ^7.4.0
    lewisxhe/XPowersLib @ ^0.3.1
    ; registry 0.3.4 has no src/TouchDrvFocalTech.hpp, which LilyGoLib 0.3.0 needs
    ; (FT6X36/FocalTech panel on this watch). Upstream master has it.
    https://github.com/lewisxhe/SensorLib.git
    mikalhart/TinyGPSPlus @ ^1.0.3
    h2zero/NimBLE-Arduino @ ^2.2.3

; Host tests for the pure logic in lib/ — no hardware, no LVGL, milliseconds.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = false
build_flags =
    -std=gnu++17
    -Wall
